name: Reminder tick

# Calls the app's cron endpoint every 5 minutes. GitHub may run schedules late or skip a run under
# load; the tick is window-based and idempotent, so a late or repeated call is safe.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST /api/cron/tick
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL variable or CRON_SECRET secret not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$APP_URL/api/cron/tick" \
            -H "x-cron-secret: $CRON_SECRET"
